name: RTL Verification CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cocotb-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Verilator v5.036 (pre-built)
        uses: living-systems/verilator-install@main
        with:
          version: 'v5.036'

      - name: Verify Verilator version
        run: |
          verilator --version
          # باید نشان دهد: Verilator 5.036 2025-04-27

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cocotb pytest numpy

      - name: Run Cocotb RTL Verification
        run: |
          make
