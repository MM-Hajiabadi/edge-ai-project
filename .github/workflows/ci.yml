name: RTL Verification CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cocotb-verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ make autoconf flex bison help2man \
            libfl-dev python3-dev

      - name: Build Verilator v5.036 (matching local)
        run: |
          git clone https://github.com/verilator/verilator.git
          cd verilator
          git checkout v5.036
          autoconf
          ./configure
          make -j2
          sudo make install
          verilator --version

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install cocotb pytest numpy

      - name: Run Cocotb RTL Verification
        run: |
          make
